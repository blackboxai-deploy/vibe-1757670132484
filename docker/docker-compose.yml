version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bankplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-bankplatform}
      POSTGRES_USER: ${DATABASE_USER:-bankplatform}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-SecureP@ssw0rd123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - bankplatform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-bankplatform} -d ${DATABASE_NAME:-bankplatform}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bankplatform-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-SecureRedisP@ss123} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bankplatform-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: bankplatform-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "14269:14269"  # Jaeger collector gRPC
      - "9411:9411"    # Zipkin compatible endpoint
    networks:
      - bankplatform-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Bank Platform API
  bankplatform-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: bankplatform-api
    restart: unless-stopped
    environment:
      # Database Configuration
      DATABASE_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${DATABASE_NAME:-bankplatform};Username=${DATABASE_USER:-bankplatform};Password=${DATABASE_PASSWORD:-SecureP@ssw0rd123};Include Error Detail=true"
      DATABASE_PROVIDER: PostgreSQL
      
      # Redis Configuration
      REDIS_CONNECTION_STRING: "redis:6379,password=${REDIS_PASSWORD:-SecureRedisP@ss123}"
      
      # JWT Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-YourVeryLongSecretKeyThatIsAtLeast32CharactersLongForMaximumSecurity123456789}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.bankplatform.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-https://app.bankplatform.com}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      
      # Security Configuration
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-YourEncryptionKeyThatIs32Chars12}
      HASHING_SALT: ${HASHING_SALT:-YourHashingSaltThatIs16Chars}
      
      # Integration Configuration
      GHIPSS_BASE_URL: ${GHIPSS_BASE_URL:-https://sandbox.ghipss.net/api/v1}
      GHIPSS_API_KEY: ${GHIPSS_API_KEY:-your-ghipss-api-key}
      GHIPSS_SECRET_KEY: ${GHIPSS_SECRET_KEY:-your-ghipss-secret-key}
      GHIPSS_ENVIRONMENT: ${GHIPSS_ENVIRONMENT:-sandbox}
      
      GHANAPAY_BASE_URL: ${GHANAPAY_BASE_URL:-https://sandbox.ghanapay.com/api/v1}
      GHANAPAY_API_KEY: ${GHANAPAY_API_KEY:-your-ghanapay-api-key}
      GHANAPAY_SECRET_KEY: ${GHANAPAY_SECRET_KEY:-your-ghanapay-secret-key}
      GHANAPAY_MERCHANT_ID: ${GHANAPAY_MERCHANT_ID:-your-merchant-id}
      GHANAPAY_ENVIRONMENT: ${GHANAPAY_ENVIRONMENT:-sandbox}
      
      NIA_BASE_URL: ${NIA_BASE_URL:-https://sandbox.nia.gov.gh/api/v1}
      NIA_API_KEY: ${NIA_API_KEY:-your-nia-api-key}
      NIA_SECRET_KEY: ${NIA_SECRET_KEY:-your-nia-secret-key}
      NIA_ENVIRONMENT: ${NIA_ENVIRONMENT:-sandbox}
      
      NALO_BASE_URL: ${NALO_BASE_URL:-https://api.nalo.com/v1}
      NALO_API_KEY: ${NALO_API_KEY:-your-nalo-api-key}
      NALO_SMS_FROM: ${NALO_SMS_FROM:-BankPlatform}
      NALO_EMAIL_FROM: ${NALO_EMAIL_FROM:-noreply@bankplatform.com}
      
      # Bank Configuration
      BANK_CODE: ${BANK_CODE:-BP001}
      
      # Monitoring Configuration
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
      
      # ASP.NET Core Configuration
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:80
      
      # Migration Configuration
      RunMigrationsOnStartup: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      
    ports:
      - "5000:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - bankplatform-network
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy (Optional for production)
  nginx:
    image: nginx:alpine
    container_name: bankplatform-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - bankplatform-api
    networks:
      - bankplatform-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_logs:
    driver: local

networks:
  bankplatform-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Health check and monitoring services
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"
    tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"